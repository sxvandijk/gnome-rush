name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot and iOS template
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-ios

      - name: Download Godot and iOS template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache ~/tpl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o ~/godot-cache/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o ~/tpl/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # The full .tpz is huge; keep only what iOS export needs
          unzip -q -o ~/tpl/templates.tpz 'templates/ios.zip' 'templates/version.txt' -d ~/tpl
          mv ~/tpl/templates/ios.zip ~/tpl/templates/version.txt ~/godot-cache/

      - name: Install Godot and iOS template
        run: |
          unzip -q -o ~/godot-cache/godot.zip -d ~/godot
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          cp ~/godot-cache/ios.zip ~/godot-cache/version.txt "$tdir/"
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sed -i '' \
            -e "s|^application/short_version=.*|application/short_version=\"$v\"|" \
            -e "s|^application/version=.*|application/version=\"${GITHUB_RUN_NUMBER}\"|" \
            export_presets.cfg

      - name: Import project
        run: '"$GODOT" --headless --import'

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --export-release "iOS" build/ios/GnomeRush.ipa
          ls -la build/ios

      - name: Build app (unsigned)
        run: |
          proj=$(find build/ios -maxdepth 1 -name '*.xcodeproj' | head -1)
          scheme=$(basename "$proj" .xcodeproj)
          xcodebuild -list -project "$proj"
          xcodebuild -project "$proj" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package IPA
        run: |
          app=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "GnomeRush-${VERSION}.ipa" Payload
          ls -la "GnomeRush-${VERSION}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: GnomeRush-${{ env.VERSION }}-ipa
          path: GnomeRush-${{ env.VERSION }}.ipa
          retention-days: 14
          if-no-files-found: error
