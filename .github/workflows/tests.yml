name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  gut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache
          curl -fsSL -o ~/godot-cache/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

      - name: Install Godot
        run: |
          unzip -q -o ~/godot-cache/godot.zip -d ~/godot
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --import'

      - name: Run GUT
        run: '"$GODOT" --headless -s addons/gut/gut_cmdln.gd -gexit'
